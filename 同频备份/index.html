'use strict';
const KEY='marriage-wireframe-v1';
const options={city:['成都','重庆','杭州','上海','北京'],edu:['高中及以下','大专','本科','硕士','博士'],time:['半年内','1年内','1～2年','2～3年','暂时没有明确时间'],kids:['希望','不希望','都可以','暂未决定'],distance:['不接受异地','短期可以异地','可以长期异地','视情况讨论'],move:['不考虑迁居','可以考虑','可以为合适的人迁居','暂不确定'],wedding:['希望正式举办','简单举办即可','不希望举办','可以商量'],living:['希望长期共同居住','可以阶段性分开居住','不强制共同居住','可以商量'],family:['希望双方家庭关系紧密','正常往来即可','希望保持一定边界','可以商量'],money:['双方经济独立','共同账户为主','部分共同 + 部分独立','可以协商'],agreement:['可以接受','希望签订','不希望签订','可以讨论'],marital:['未婚','离异','丧偶'],existing:['无','有'],job:['互联网 / 科技','教育','医疗','金融','政府 / 事业单位','商业 / 销售','文化 / 艺术','自由职业','创业','制造业','其他']};
const names=['小雨','林林','安然','可欣','晓宁','知夏','亦禾','陈宇','周远','林舟','许言','程浩','江川','沈一'];
const users=names.map((name,i)=>({id:i+1,name,gender:i<7?'女':'男',age:[28,30,27,29,32,26,34,31,29,33,28,35,30,32][i],height:i<7?162+(i%5)*2:174+(i%5)*2,city:['成都','成都','重庆','成都','杭州','上海','成都'][i%7],edu:i%3===0?'硕士':'本科',job:options.job[i%options.job.length],marital:i%7===6?'离异':'未婚',existing:i%7===6?'有':'无',time:options.time[i%7===2?3:2],kids:i%7===4?'不希望':i%7===5?'都可以':'希望',longCity:['成都','成都','重庆','成都','杭州','上海','成都'][i%7],distance:options.distance[i%4],move:options.move[i%4],wedding:options.wedding[i%4],living:options.living[0],family:options.family[i%3],money:options.money[2],agreement:options.agreement[i%3],bio:['愿意认真沟通，也希望把未来的生活一点点商量清楚。','周末喜欢散步和看书，希望彼此独立，也能分享日常。','期待坦诚、稳定的关系，重要的事情一起做决定。'][i%3],incoming:i%7===0||i%7===2,prefMin:24,prefMax:i%7===6?28:38,active:true,verified:true}));
function defaults(){return {route:'invite',step:0,auth:{real:false,live:false},me:{name:'',gender:'男',dob:'1995-06-12',city:'成都',height:178,edu:'本科',job:'互联网 / 科技',marital:'未婚',existing:'无',photo:false,bio:'',time:'1～2年',longCity:'成都',distance:'短期可以异地',move:'可以考虑',wedding:'简单举办即可',living:'希望长期共同居住',kids:'希望',money:'部分共同 + 部分独立',family:'正常往来即可',agreement:'可以接受'},pref:{min:24,max:36,agePriority:'必须满足',city:'成都',cityPriority:'比较重要',kids:'希望',kidsPriority:'比较重要',time:'1～2年',timePriority:'比较重要',heightMin:150,heightMax:195,heightPriority:'不限',edu:'本科',eduPriority:'不限',marital:'未婚',maritalPriority:'不限',existing:'无',existingPriority:'不限',longCity:'成都',longCityPriority:'不限',distance:'短期可以异地',distancePriority:'不限',move:'可以考虑',movePriority:'不限',wedding:'简单举办即可',weddingPriority:'不限',living:'希望长期共同居住',livingPriority:'比较重要',family:'正常往来即可',familyPriority:'不限',money:'部分共同 + 部分独立',moneyPriority:'不限',agreement:'可以接受',agreementPriority:'不限'},likes:[],passes:{},matches:[],blocked:[],cancelled:[],messages:{},read:{},incoming:[],complete:false,intro:false,hidden:false,phone:'',invite:'',code:'',consent:false};}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{s=defaults()}
let messageDraft='';
let filter={city:'不限',min:18,max:60,heightMin:140,heightMax:210,edu:'不限',time:'不限',kids:'不限',distance:'不限'},draftFilter=null,draftPref=null,modal=null,error='',toast='',selected=null,backRoute='discover',editing=false,codeSent=false,timer=null;
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function age(){let d=new Date(s.me.dob),n=new Date();return n.getFullYear()-d.getFullYear()-(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())?1:0)}
function me(){return {...s.me,age:age()}}
function compatible(p,u){if(p.agePriority==='必须满足'&&(u.age<+p.min||u.age>+p.max))return false;if(p.heightPriority==='必须满足'&&(u.height<+p.heightMin||u.height>+p.heightMax))return false;for(const k of ['city','kids','time','edu','marital','existing','longCity','distance','move','wedding','living','family','money','agreement'])if(p[k+'Priority']==='必须满足'&&(k==='edu'?options.edu.indexOf(u.edu)<options.edu.indexOf(p.edu):p[k]!==u[k]))return false;return true}
function eligible(u){return u.gender!==s.me.gender&&u.active&&u.verified&&!s.blocked.includes(u.id)&&!s.cancelled.includes(u.id)&&compatible(s.pref,u)&&age()>=u.prefMin&&age()<=u.prefMax}
function directional(p,u){let points=0,total=0;for(const [k,w] of Object.entries({city:8,kids:18,time:12,longCity:12,move:8,living:10,wedding:5,family:8,money:8,agreement:4,edu:2})){if(p[k+'Priority']==='不限')continue;total+=w;let desired=p[k];points+=desired===u[k]?w:([desired,u[k]].some(v=>['都可以','可以商量','可以协商','可以讨论','暂未决定','暂不确定','城市可协商','全国均可'].includes(v))?w*.7:w*.3)}if(p.agePriority!=='不限'){total+=4;points+=u.age>=p.min&&u.age<=p.max?4:0}if(p.heightPriority!=='不限'){total+=1;points+=u.height>=p.heightMin&&u.height<=p.heightMax?1:0}return total?points/total*100:70}
function score(u){const p={...defaults().pref,min:u.prefMin,max:u.prefMax};for(const k of ['city','kids','time','longCity','move','living','wedding','family','money','agreement','edu'])p[k]=u[k];const a=directional(s.pref,u),b=directional(p,me());return Math.round(Math.min(a,b)*.6+(a+b)/2*.4)}
function timeLabel(t){return t==='暂时没有明确时间'?'结婚时间待定':t+'内结婚'}
function level(u){let n=score(u);return n>=85?'高度匹配':n>=70?'比较匹配':n>=55?'可以了解':'需求差异较多'}
function candidates(f=filter){return users.filter(u=>eligible(u)&&!s.likes.includes(u.id)&&!(s.passes[u.id]&&Date.now()-s.passes[u.id]<30*86400000)&&!s.matches.includes(u.id)&&score(u)>=55&&u.age>=+f.min&&u.age<=+f.max&&u.height>=+f.heightMin&&u.height<=+f.heightMax&&['city','time','kids','distance'].every(k=>f[k]==='不限'||u[k]===f[k])&&(f.edu==='不限'||options.edu.indexOf(u.edu)>=options.edu.indexOf(f.edu))).sort((a,b)=>score(b)-score(a)||a.id-b.id)}
function incoming(u){return u.incoming||s.incoming.includes(u.id)}
function reasons(u){const labels={kids:'婚育规划',time:'结婚时间',longCity:'长期生活城市',money:'经济安排'};return Object.keys(labels).map(k=>`<div>${s.me[k]===u[k]?'✓':'△'} ${labels[k]}${s.me[k]===u[k]?'一致':'需要沟通'}</div>`).slice(0,3).join('')}
function b(text,action,cls='',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${text}</button>`}
function field(label,key,value,type='text',group='me',extra=''){return `<label class="field"><span>${label}</span><input type="${type}" data-group="${group}" data-key="${key}" value="${esc(value)}" ${extra}></label>`}
function select(label,key,value,values,group='me'){return `<label class="field"><span>${label}</span><select data-group="${group}" data-key="${key}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function header(title,back,other=''){return `<header class="head">${back?b('‹',back,'icon','aria-label="返回"'):''}<h2>${title}</h2>${other}</header>`}
function foot(content){return `<div class="bottom">${content}</div>`}
function tabs(){return `<nav class="tabs" aria-label="底部导航">${[['discover','发现'],['matches','Match'],['mine','我的']].map(([r,t])=>b(t,'go:'+r,s.route===r?'active':'')).join('')}</nav>`}
function notice(t){toast=t;render();clearTimeout(timer);timer=setTimeout(()=>{toast='';app.querySelector('.toast')?.remove()},2300)}
function go(r){error='';modal=null;s.route=r;save();render()}
function row(label,value){return `<div class="kv"><span>${label}</span><span>${esc(value)}</span></div>`}
function photo(u){return `<div class="photo" aria-label="虚拟用户照片占位"><b>${esc(u.name.slice(0,1)||'你')}</b><small>照片占位 · 虚拟${u.gender}用户</small></div>`}
function person(u,action,sub){return b(`<span class="avatar">${u.name.slice(0,1)}</span><span><strong>${u.name} · ${u.age}</strong><span class="muted">${sub||u.city+' · '+level(u)}</span></span>` ,action,'person')}
function prefs(p,group){const pr=(key)=>select('重要程度',key+'Priority',p[key+'Priority'],['必须满足','比较重要','不限'],group);return `<div class="note">必须满足：双向检查，不符合则不推荐。比较重要：影响排序。不限：不限制该条件。</div><h4>年龄范围</h4><div class="row">${field('最小年龄','min',p.min,'number',group,'min="18" max="80"')}${field('最大年龄','max',p.max,'number',group,'min="18" max="80"')}</div>${pr('age')}${select('城市','city',p.city,options.city,group)}${pr('city')}${select('希望对方的婚育规划','kids',p.kids,options.kids,group)}${pr('kids')}${select('期望结婚时间','time',p.time,options.time,group)}${pr('time')}<details><summary>更多匹配条件</summary><div class="row">${field('最低身高 cm','heightMin',p.heightMin,'number',group,'min="140" max="210"')}${field('最高身高 cm','heightMax',p.heightMax,'number',group,'min="140" max="210"')}</div>${pr('height')}${[['edu','最低学历'],['marital','婚姻状态'],['existing','是否已有子女'],['longCity','长期生活城市'],['distance','异地接受度'],['move','迁居意愿'],['wedding','婚礼需求'],['living','婚后居住'],['family','双方父母参与程度'],['money','经济安排'],['agreement','婚前财产协议']].map(([k,l])=>select(l,k,p[k],options[k==='longCity'?'city':k],group)+pr(k)).join('')}</details>`}
function login(){if(s.route==='invite')return header('婚姻需求')+`<main class="content"><p class="eyebrow">内测邀请 · 01 / 03</p><h3>从认真了解开始</h3><p class="muted">先验证邀请码，再建立你的婚姻需求资料。</p>${field('邀请码','invite',s.invite,'text','account','placeholder="输入邀请码" autocomplete="off"')}<div class="note">原型体验邀请码：<b>MARRY2026</b><br>所有身份、用户和聊天均为模拟。</div>${error?'<p class="error" role="alert">'+error+'</p>':''}${b('没有邀请码？','noinvite','link')}</main>`+foot(b('验证邀请码','invite','primary'));
